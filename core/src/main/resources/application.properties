# database
spring.datasource.driver-class-name=com.ibm.db2.jcc.DB2Driver
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=no.nav.brevserver.core.CustomDb2Dialect
spring.jpa.properties.hibernate.generate_statistics=false
spring.transaction.default-timeout=300s
spring.jpa.properties.hibernate.default_schema=BS475Q
com.ibm.mq.cfg.AMQ_DISABLE_CLIENT_AMS=TRUE
server.servlet.context-path=/brevweb
brevserver.server=http://localhost:8080/brevweb/
BrevserverServiceBean.knappstatus.default=7
BrevserverServiceBean.knappstatus.BI01.BI01P11=15
BrevserverServiceBean.knappstatus.BI01.BI01P18=15
BrevserverServiceBean.knappstatus.BI01.BI01X01=15
BrevserverServiceBean.knappstatus.BI01.BI01X02=15
BrevserverServiceBean.knappstatus.PE_IY_03_156=15
BrevserverServiceBean.knappstatus.PE_UT_04_101=15
BrevserverServiceBean.knappstatus.PE_UT_04_102=15
BrevserverServiceBean.knappstatus.PE_UT_04_104=15
BrevserverServiceBean.knappstatus.PE_IY_05_300=15
BrevserverServiceBean.knappstatus.GE_IY_03_156=15

spring.main.allow-bean-definition-overriding=true
spring.main.banner_mode=off
