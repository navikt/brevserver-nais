kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: brevserver-nais
  namespace: {{ NAMESPACE }}
  labels:
    team: teamdokumenthandtering
spec:
  env:
    - name: SPRING_DATASOURCE_URL
      value: {{ SPRING_DATASOURCE_URL }}
      - name: MQGATEWAY01_HOSTNAME
        value: { { MQGATEWAY01_HOSTNAME } }
      - name: MQGATEWAY01_PORT
        value: "{{ MQGATEWAY01_PORT }}"
      - name: MQGATEWAY01_NAME
        value: { { MQGATEWAY01_NAME } }
      - name: BREVSERVER_MOTTAK_ARKIV_QUEUENAME
        value: { { BREVSERVER_MOTTAK_ARKIV_QUEUENAME } }
      - name: BREVSERVER_MOTTAK_ARKIV_PE_QUEUENAME
        value: { { BREVSERVER_MOTTAK_ARKIV_PE_QUEUENAME } }
      - name: DIALOGUE_ONLINE_QUEUENAME
        value: { { DIALOGUE_ONLINE_QUEUENAME } }
      - name: DIALOGUE_ONLINE_PE_QUEUENAME
        value: { { DIALOGUE_ONLINE_PE_QUEUENAME } }
      - name: BREVSERVER_ONLINEBREV_QUEUENAME
        value: { { BREVSERVER_ONLINEBREV_QUEUENAME } }
      - name: BREVSERVER_ONLINEBREV_PE_QUEUENAME
        value: { { BREVSERVER_ONLINEBREV_PE_QUEUENAME } }
      - name: BREVSERVER_MOTTAK_ONLINE_QUEUENAME
        value: { { BREVSERVER_MOTTAK_ONLINE_QUEUENAME } }
      - name: BREVSERVER_MOTTAK_ONLINE_PE_QUEUENAME
        value: { { BREVSERVER_MOTTAK_ONLINE_PE_QUEUENAME } }
      - name: ESB_BREV_PE01_REPLY_QUEUENAME
        value: { { ESB_BREV_PE01_REPLY_QUEUENAME } }
      - name: BREVSERVER_DLQ_QUEUENAME
        value: { { BREVSERVER_DLQ_QUEUENAME } }
      - name: BREVSERVER_DLQ_PE_QUEUENAME
        value: { { BREVSERVER_DLQ_PE_QUEUENAME } }
  image: {{ image }}
  ingresses:
    {{#each INGRESSES}}
    - {{this }}
    {{/each}}
  liveness:
    path: /isAlive
    port: 8080
    initialDelay: 30
    failureThreshold: 10
  port: 8080
  prometheus:
    enabled: true
    path: /actuator/prometheus
  readiness:
    path: /isReady
    port: 8080
    initialDelay: 30
    timeout: 3
  replicas:
    min: 2
    max: 4
    cpuThresholdPercentage: 50
  resources:
    limits:
      cpu: 3000m
      memory: 3072Mi
    requests:
      memory: 1920Mi
  vault:
    enabled: true
