kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: {{ APP_NAME }}
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "256m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  envFrom:
    - secret: {{ BREVSERVER_SECRET }}
  env:
    - name: JAVA_TRUSTSTORE_OPTIONS
      value: "-Djavax.net.ssl.trustStore=$(NAV_TRUSTSTORE_PATH)
              -Djavax.net.ssl.trustStorePassword=$(NAV_TRUSTSTORE_PASSWORD)"
    - name: JDK_JAVA_OPTIONS
      value: "-Djavax.net.ssl.keyStore=$(NAV_TRUSTSTORE_PATH)
              -Djavax.net.ssl.keyStorePassword=$(NAV_TRUSTSTORE_PASSWORD)
              -Djavax.net.ssl.keyStoreType=jks
              -XX:MaxRAMPercentage=75
              $(JAVA_PROXY_OPTIONS) $(JAVA_TRUSTSTORE_OPTIONS)"
    - name: MQGATEWAY01_HOSTNAME
      value: {{ MQGATEWAY01_HOSTNAME }}
    - name: MQGATEWAY01_PORT
      value: "{{ MQGATEWAY01_PORT }}"
    - name: MQGATEWAY01_NAME
      value: {{ MQGATEWAY01_NAME }}
    - name: MQGATEWAY01_CHANNEL_SECURENAME
      value: {{ MQGATEWAY01_CHANNEL_SECURENAME }}
    - name: MOTTAK_ARKIV_QUEUENAME
      value: {{ MOTTAK_ARKIV_QUEUENAME }}
    - name: DIALOGUE_ONLINE_QUEUENAME
      value: {{ DIALOGUE_ONLINE_QUEUENAME }}
    - name: DIALOGUE_ONLINE_PE_QUEUENAME
      value: {{ DIALOGUE_ONLINE_PE_QUEUENAME }}
    - name: ONLINEBREV_QUEUENAME
      value: {{ ONLINEBREV_QUEUENAME }}
    - name: ONLINEBREV_PE_QUEUENAME
      value: {{ ONLINEBREV_PE_QUEUENAME }}
    - name: MOTTAK_ONLINE_LINUX_QUEUENAME
      value: {{ MOTTAK_ONLINE_LINUX_QUEUENAME }}
    - name: MOTTAK_ONLINE_PE_LINUX_QUEUENAME
      value: {{ MOTTAK_ONLINE_PE_LINUX_QUEUENAME }}
    - name: MOTTAK_ARKIV_PE_LINUX_QUEUENAME
      value: {{ MOTTAK_ARKIV_PE_LINUX_QUEUENAME }}
    - name: BREV_REPLY_PE_QUEUENAME
      value: {{ BREV_REPLY_PE_QUEUENAME }}
    - name: DEADLETTER_QUEUENAME
      value: {{ DEADLETTER_QUEUENAME }}
    - name: DEADLETTER_PE_QUEUENAME
      value: {{ DEADLETTER_PE_QUEUENAME }}
    - name: SECURITY_TOKEN_SERVICE_TOKEN_URL
      value: {{ SECURITY_TOKEN_SERVICE_TOKEN_URL }}
    - name: BREVSERVER_LOGG_XML
      value: "{{ BREVSERVER_LOGG_XML }}"
    - name: BREVSERVER_DATABASE_POOLSIZE
      value: "{{ BREVSERVER_DATABASE_POOLSIZE }}"
    - name: BREVSERVER_ENDPOINTS_DOKARKIV_URL
      value: "{{ BREVSERVER_ENDPOINTS_DOKARKIV_URL }}"
    - name: BREVSERVER_ENDPOINTS_DOKARKIV_SCOPE
      value: "{{ BREVSERVER_ENDPOINTS_DOKARKIV_SCOPE }}"
    - name: BREVSERVER_ENDPOINTS_SAF_URL
      value: "{{ BREVSERVER_ENDPOINTS_SAF_URL }}"
    - name: BREVSERVER_ENDPOINTS_SAF_SCOPE
      value: "{{ BREVSERVER_ENDPOINTS_SAF_SCOPE }}"
    - name: NO_NAV_SECURITY_JWT_ISSUER_RESTSTS_DISCOVERYURL
      value: {{ NO_NAV_SECURITY_JWT_ISSUER_RESTSTS_DISCOVERYURL }}
    - name: NO_NAV_SECURITY_JWT_ISSUER_RESTSTS_ACCEPTED_AUDIENCE
      value: {{ NO_NAV_SECURITY_JWT_ISSUER_RESTSTS_ACCEPTED_AUDIENCE }}
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "deployment.environment.name={{ ENVIRONMENT }}"
  image: {{ image }}
  ingresses:
    {{#each INGRESSES}}
        - {{ this }}
    {{/each}}
  liveness:
    path: brevweb/actuator/health/liveness
    port: 8080
    initialDelay: 30
    failureThreshold: 10
  port: 8080
  prometheus:
    enabled: true
    path: brevweb/actuator/prometheus
  readiness:
    path: brevweb/actuator/health/readiness
    port: 8080
    initialDelay: 30
    timeout: 3
  replicas:
    min: {{ MIN_REPLICAS }}
    max: {{ MAX_REPLICAS }}
    cpuThresholdPercentage: 50
  resources:
    limits:
      memory: 4096Mi
    requests:
      cpu: 50m
      memory: 2048Mi
  webproxy: true
  azure:
    application:
      enabled: true
      allowAllUsers: true
  {{#if AZURE_IAC_RULES}}
  accessPolicy:
    inbound:
      rules:
      {{#each AZURE_IAC_RULES}}
        - application: {{ app }}
          namespace: {{ namespace }}
          cluster: {{ cluster }}
          permissions:
            {{#if scopes}}
            scopes:
              {{#each scopes}}
              - "{{this}}"
              {{/each}}
            {{/if}}
      {{/each}}
  {{/if}}
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java
